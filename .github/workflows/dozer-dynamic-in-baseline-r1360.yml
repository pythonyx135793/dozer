name: Dozer dynamic IN original baseline R1360

on:
  push:
    branches: [codex/dozer1659-baseline-proof-r1360]

permissions:
  contents: read

jobs:
  original-baseline:
    if: github.repository == 'pythonyx135793/dozer'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact proof commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Verify pinned source and run isolated ordinary-default baseline
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -B proof/dozer1659-baseline-r1360/baseline.py
      - name: Export complete baseline evidence through ordinary job logs
        if: always()
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -B proof/dozer1659-baseline-r1360/log_export.py
