name: WASM configuration schema follow-up

on:
  push:
    branches: [codex/dozer1653-config-proof-r2276]

permissions:
  contents: read

jobs:
  configuration:
    if: github.repository == 'pythonyx135793/dozer'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout the frozen proof
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 3
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Generate the schema for previously tested configuration source
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -B proof/dozer1653-config-r2276/validate.py
